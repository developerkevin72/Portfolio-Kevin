<header
  class="fixed inset-x-0 top-0 z-50 px-4 py-4 transition-all duration-300 sm:px-6"
  [class.py-3]="isScrolled"
>
  <div
    class="mx-auto flex max-w-7xl items-center justify-between rounded-2xl border px-4 py-3 transition-all duration-300 sm:px-5"
    [class.border-white/10]="!isScrolled"
    [class.bg-transparent]="!isScrolled"
    [class.border-violet-400/20]="isScrolled"
    [class.bg-black/60]="isScrolled"
    [class.shadow-2xl]="isScrolled"
    [class.shadow-violet-950/20]="isScrolled"
    [class.backdrop-blur-xl]="isScrolled"
  >

    <!-- Logo -->
<!-- Logo -->
<a
  href="#home"
  (click)="closeMenu()"
  class="group relative flex items-center"
  aria-label="Go to home">
  
  <span class="relative flex items-baseline">
    <!-- Joemics -->
    <span
      class="bg-linear-to-r from-violet-300 via-violet-400 to-blue-400 bg-clip-text text-xl font-black italic tracking-[-0.06em] text-transparent transition-all duration-300 group-hover:from-violet-200 group-hover:via-purple-300 group-hover:to-blue-300 group-hover:[filter:drop-shadow(0_0_10px_rgba(139,92,246,0.6))] sm:text-xl"
    >
      Joemics
    </span>

    <!-- Kevin -->
    <span
      class="ml-1.5 bg-linear-to-r from-violet-300 to-blue-400 bg-clip-text text-lg font-light italic tracking-[-0.04em] text-transparent transition-all duration-300 group-hover:[filter:drop-shadow(0_0_8px_rgba(96,165,250,0.45))] sm:text-xl"
    >
      Kevin
    </span>

    <!-- Accent line -->
    <span
      class="absolute -bottom-1 left-1/2 h-px w-1/2 -translate-x-1/2 bg-linear-to-r from-violet-500 via-violet-400 to-blue-500 opacity-60 transition-all duration-300 group-hover:w-3/4 group-hover:opacity-100"
    ></span>
  </span>
</a>

    <!-- Desktop Navigation -->
    <nav
      class="hidden items-center gap-6 lg:flex"
      aria-label="Main navigation"
    >
      <a
        href="#about"
        class="group relative text-sm font-medium text-white/60 transition-colors duration-300 hover:text-white"
      >
        About

        <span
          class="absolute -bottom-2 left-1/2 h-px w-0 -translate-x-1/2 bg-violet-400 shadow-[0_0_10px_rgba(139,92,246,0.8)] transition-all duration-300 group-hover:w-full"
        ></span>
      </a>

      <a
        href="#skills"
        class="group relative text-sm font-medium text-white/60 transition-colors duration-300 hover:text-white"
      >
        Skills

        <span
          class="absolute -bottom-2 left-1/2 h-px w-0 -translate-x-1/2 bg-violet-400 shadow-[0_0_10px_rgba(139,92,246,0.8)] transition-all duration-300 group-hover:w-full"
        ></span>
      </a>

      <a
        href="#experience"
        class="group relative text-sm font-medium text-white/60 transition-colors duration-300 hover:text-white"
      >
        Experience

        <span
          class="absolute -bottom-2 left-1/2 h-px w-0 -translate-x-1/2 bg-violet-400 shadow-[0_0_10px_rgba(139,92,246,0.8)] transition-all duration-300 group-hover:w-full"
        ></span>
      </a>

      <a
        href="#projects"
        class="group relative text-sm font-medium text-white/60 transition-colors duration-300 hover:text-white"
      >
        Projects

        <span
          class="absolute -bottom-2 left-1/2 h-px w-0 -translate-x-1/2 bg-violet-400 shadow-[0_0_10px_rgba(139,92,246,0.8)] transition-all duration-300 group-hover:w-full"
        ></span>
      </a>

      <a
        href="#education"
        class="group relative text-sm font-medium text-white/60 transition-colors duration-300 hover:text-white"
      >
        Education

        <span
          class="absolute -bottom-2 left-1/2 h-px w-0 -translate-x-1/2 bg-violet-400 shadow-[0_0_10px_rgba(139,92,246,0.8)] transition-all duration-300 group-hover:w-full"
        ></span>
      </a>

      <a
        href="#contact"
        class="group relative text-sm font-medium text-white/60 transition-colors duration-300 hover:text-white"
      >
        Contact

        <span
          class="absolute -bottom-2 left-1/2 h-px w-0 -translate-x-1/2 bg-violet-400 shadow-[0_0_10px_rgba(139,92,246,0.8)] transition-all duration-300 group-hover:w-full"
        ></span>
      </a>
    </nav>

    <!-- Desktop CTA -->
    <a
      href="#contact"
      class="group hidden items-center gap-2 rounded-full border border-violet-400/40 bg-violet-500/10 px-4 py-2 text-sm font-semibold text-white transition-all duration-300 hover:-translate-y-0.5 hover:border-violet-400/80 hover:bg-violet-500/20 hover:shadow-[0_0_25px_rgba(139,92,246,0.2)] lg:flex"
    >
      Let's Talk

      <span
        class="transition-transform duration-300 group-hover:-translate-y-0.5 group-hover:translate-x-0.5"
      >
        ↗
      </span>
    </a>

    <!-- Mobile Menu Button -->
    <button
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="mobile-menu"
      aria-label="Toggle navigation menu"
      class="group flex h-10 w-10 shrink-0 flex-col items-center justify-center gap-1.5 rounded-xl border border-white/10 bg-white/5 transition-all duration-300 hover:border-violet-400/40 hover:bg-violet-500/10 lg:hidden"
    >
      <span
        class="h-0.5 w-5 rounded-full bg-white transition-all duration-300"
        [class.translate-y-2]="isMenuOpen"
        [class.rotate-45]="isMenuOpen"
      ></span>

      <span
        class="h-0.5 w-5 rounded-full bg-white transition-all duration-300"
        [class.opacity-0]="isMenuOpen"
      ></span>

      <span
        class="h-0.5 w-5 rounded-full bg-white transition-all duration-300"
        [class.-translate-y-2]="isMenuOpen"
        [class.-rotate-45]="isMenuOpen"
      ></span>
    </button>

  </div>

  <!-- Mobile Navigation -->
  <div
    id="mobile-menu"
    class="mx-auto mt-2 max-w-7xl overflow-hidden rounded-2xl border border-white/10 bg-black/90 backdrop-blur-xl transition-all duration-300 lg:hidden"
    [class.max-h-0]="!isMenuOpen"
    [class.max-h-[500px]]="isMenuOpen"
    [class.opacity-0]="!isMenuOpen"
    [class.opacity-100]="isMenuOpen"
    [class.pointer-events-none]="!isMenuOpen"
    [attr.aria-hidden]="!isMenuOpen"
  >
    <nav
      class="flex flex-col p-3"
      aria-label="Mobile navigation"
    >
      <a
        href="#about"
        (click)="closeMenu()"
        class="rounded-xl px-4 py-3 text-sm font-medium text-white/70 transition-colors duration-200 hover:bg-white/5 hover:text-white"
      >
        About
      </a>

      <a
        href="#skills"
        (click)="closeMenu()"
        class="rounded-xl px-4 py-3 text-sm font-medium text-white/70 transition-colors duration-200 hover:bg-white/5 hover:text-white"
      >
        Skills
      </a>

      <a
        href="#experience"
        (click)="closeMenu()"
        class="rounded-xl px-4 py-3 text-sm font-medium text-white/70 transition-colors duration-200 hover:bg-white/5 hover:text-white"
      >
        Experience
      </a>

      <a
        href="#projects"
        (click)="closeMenu()"
        class="rounded-xl px-4 py-3 text-sm font-medium text-white/70 transition-colors duration-200 hover:bg-white/5 hover:text-white"
      >
        Projects
      </a>

      <a
        href="#education"
        (click)="closeMenu()"
        class="rounded-xl px-4 py-3 text-sm font-medium text-white/70 transition-colors duration-200 hover:bg-white/5 hover:text-white"
      >
        Education
      </a>

      <a
        href="#contact"
        (click)="closeMenu()"
        class="rounded-xl px-4 py-3 text-sm font-medium text-white/70 transition-colors duration-200 hover:bg-white/5 hover:text-white"
      >
        Contact
      </a>

      <a
        href="#contact"
        (click)="closeMenu()"
        class="group mt-2 flex items-center justify-center gap-2 rounded-xl border border-violet-400/40 bg-violet-500/10 px-4 py-3 text-sm font-semibold text-white transition-all duration-300 hover:border-violet-400/70 hover:bg-violet-500/20"
      >
        Let's Talk

        <span
          class="transition-transform duration-300 group-hover:-translate-y-0.5 group-hover:translate-x-0.5"
        >
          ↗
        </span>
      </a>
    </nav>
  </div>

</header>
